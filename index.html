<style>
:root{--bg:#060507;--bg2:#0A080C;--red:#C8102E;--red-d:#7A0C18;--red-b:#D81E3C;--gold:#C9B68B;--gold-bright:#E8D6A6;--cream:#ECE8E2;--muted:#B0AAB4;--muted2:#8C8790;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);}
body{color:#C9C5CC;font-family:'Cormorant Garamond',serif;overflow-x:hidden;-webkit-font-smoothing:antialiased;}
img{-webkit-user-drag:none;-khtml-user-drag:none;-moz-user-drag:none;-o-user-drag:none;user-drag:none;}
a{outline:none;}
::selection{background:transparent;}
::-webkit-scrollbar{width:10px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:linear-gradient(#6E6A64,#3A0A12);border-radius:10px;}
@media print{html,body{display:none!important;}}
@keyframes beeiGlow{0%,100%{opacity:.4;}50%{opacity:.85;}}
@keyframes beeiFloat{0%,100%{transform:translateY(0) rotate(var(--r,0deg));}50%{transform:translateY(-16px) rotate(var(--r,0deg));}}
@keyframes beeiSpinDisc{to{transform:rotate(360deg);}}
@keyframes heartBeat{0%,100%{transform:scale(1);}30%{transform:scale(1.18);}45%{transform:scale(.96);}}
.page{position:relative;min-height:100vh;width:100%;display:flex;align-items:center;justify-content:center;padding:120px 28px 90px;overflow:hidden;scroll-snap-align:start;}
html{scroll-snap-type:y mandatory;scroll-behavior:smooth;}
.nav-brand{position:fixed;top:16px;left:40px;z-index:80;font-family:'Cinzel Decorative',serif;font-weight:900;font-size:26px;letter-spacing:3px;background:linear-gradient(180deg,#FFFFFF,#F0ECE4 38%,#C7BCA6);-webkit-background-clip:text;background-clip:text;color:transparent;text-decoration:none;}
.nav-menu{position:fixed;top:74px;right:40px;z-index:80;display:flex;align-items:center;gap:30px;padding:10px 18px;background:linear-gradient(180deg,rgba(10,8,12,.78),rgba(10,8,12,.35));border:1px solid rgba(201,182,139,.16);border-radius:40px;backdrop-filter:blur(6px);}
.nav-menu a{font-family:'Cinzel',serif;font-size:12px;letter-spacing:2.5px;text-transform:uppercase;color:#B7B2BA;text-decoration:none;cursor:pointer;transition:color .25s;}
.nav-menu a:hover{color:var(--gold-bright);}
.hero-wrap{position:relative;z-index:5;display:flex;align-items:center;justify-content:center;gap:54px;max-width:1080px;flex-wrap:wrap;}
.hero-glow{position:absolute;left:50%;top:50%;width:720px;height:720px;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(160,16,42,.30) 0%,rgba(90,10,24,.12) 40%,transparent 66%);filter:blur(12px);animation:beeiGlow 8s ease-in-out infinite;}
.portrait-block{position:relative;flex:none;}
.portrait-ring{position:relative;width:300px;height:300px;border-radius:50%;padding:5px;background:linear-gradient(160deg,var(--gold-bright),rgba(201,182,139,.15) 45%,var(--red-d));box-shadow:0 18px 60px rgba(160,16,42,.40),0 0 0 1px rgba(231,228,224,.06);}
.portrait-ring img.face{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;}
.flag-badge{position:absolute;top:6px;right:6px;width:50px;height:50px;border-radius:50%;border:2px solid rgba(231,228,224,.6);overflow:hidden;box-shadow:0 6px 16px rgba(0,0,0,.5);background:#fff;}
.flag-badge img{width:100%;height:100%;object-fit:cover;display:block;}
.tauro-badge{position:absolute;bottom:8px;left:8px;width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at 40% 35%,#F6E7B0,#C9A24A 70%,#8A6A24);border:1px solid rgba(231,228,224,.5);box-shadow:0 6px 16px rgba(0,0,0,.5);}
.tauro-badge img{width:70%;height:70%;object-fit:contain;display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4));}
.hero-divider{width:1px;align-self:stretch;min-height:280px;background:linear-gradient(180deg,transparent,rgba(201,182,139,.55),transparent);}
.hero-text{position:relative;max-width:520px;text-align:left;}
.hero-kicker{display:flex;align-items:center;gap:16px;margin-bottom:18px;}
.hero-kicker span.line{height:1px;width:46px;background:linear-gradient(90deg,transparent,var(--gold));}
.hero-kicker span.lbl{font-family:'Cinzel',serif;font-size:11px;letter-spacing:5px;color:var(--gold);text-transform:uppercase;}
.hero-name{margin:0;font-family:'Cinzel Decorative',serif;font-weight:900;font-size:clamp(64px,11vw,150px);line-height:.9;letter-spacing:5px;background:linear-gradient(180deg,#FFFFFF 0%,#F0ECE4 32%,#C7BCA6 70%,#8E867A 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 2px 60px rgba(160,16,42,.25);}
.hero-phrase{margin:24px 0 0;font-size:20px;font-style:italic;line-height:1.55;color:var(--muted);}
.hero-btns{display:flex;gap:16px;margin-top:34px;flex-wrap:wrap;}
.btn-married{font-family:'Cinzel',serif;font-size:13px;letter-spacing:2.5px;text-transform:uppercase;color:#F6EFE6;text-decoration:none;padding:15px 42px;cursor:pointer;background:linear-gradient(180deg,#D11430,#8E0E1F);box-shadow:0 12px 34px rgba(180,18,44,.34);border:1px solid rgba(231,228,224,.12);transition:transform .2s,box-shadow .2s;}
.btn-married:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(180,18,44,.5);}
.btn-amigos{font-family:'Cinzel',serif;font-size:13px;letter-spacing:2.5px;text-transform:uppercase;color:#E7E3DD;text-decoration:none;padding:15px 42px;cursor:pointer;background:none;border:1px solid rgba(231,228,224,.34);transition:border-color .2s,color .2s;}
.btn-amigos:hover{border-color:var(--gold);color:var(--gold-bright);}
.scroll-hint{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);font-family:'Poiret One',sans-serif;font-size:10px;letter-spacing:5px;color:#6E6A64;text-transform:uppercase;}
.petal{position:absolute;pointer-events:none;}
.section-head{text-align:center;margin-bottom:50px;}
.section-kicker{font-family:'Cinzel',serif;font-size:12px;letter-spacing:6px;color:var(--gold);text-transform:uppercase;}
.section-title{margin:14px 0 0;font-family:'Cinzel Decorative',serif;font-weight:700;font-size:clamp(40px,6vw,68px);letter-spacing:2px;background:linear-gradient(180deg,#FFFFFF,#EDEAE4 45%,#B7B2AC);-webkit-background-clip:text;background-clip:text;color:transparent;}
.amigos-grid{display:flex;gap:60px;justify-content:center;flex-wrap:wrap;}
.amigo{display:flex;flex-direction:column;align-items:center;gap:14px;text-decoration:none;}
.amigo .avatar{width:80px;height:80px;border-radius:50%;padding:3px;background:linear-gradient(160deg,var(--gold-bright),rgba(201,182,139,.2) 50%,var(--red-d));box-shadow:0 8px 24px rgba(0,0,0,.5);transition:transform .25s,box-shadow .25s;}
.amigo .avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;}
.amigo:hover .avatar{transform:translateY(-5px) scale(1.05);box-shadow:0 14px 32px rgba(180,18,44,.4);}
.amigo .name{font-family:'Cinzel',serif;font-size:14px;letter-spacing:2px;color:var(--cream);text-transform:uppercase;}
#married{flex-direction:column;}
.married-inner{position:relative;z-index:2;text-align:center;display:flex;flex-direction:column;align-items:center;}
.married-heart{font-size:64px;color:var(--red);line-height:1;margin-bottom:22px;filter:drop-shadow(0 0 18px rgba(200,16,46,.8));animation:heartBeat 1.4s ease-in-out infinite;}
.married-braii{font-family:'Cinzel Decorative',serif;font-weight:900;font-size:clamp(46px,9vw,96px);letter-spacing:4px;text-decoration:none;background:linear-gradient(180deg,#FFE3E8,#FF9FB0 40%,var(--red));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 2px 50px rgba(200,16,46,.4);transition:transform .25s;display:inline-block;}
.married-braii:hover{transform:scale(1.04);}
#musica{flex-direction:column;}
.player-card{position:relative;display:flex;gap:30px;align-items:center;padding:30px;max-width:760px;width:100%;background:linear-gradient(180deg,#120F15,#0A080C);border:1px solid rgba(201,182,139,.20);box-shadow:0 30px 80px rgba(0,0,0,.6);flex-wrap:wrap;}
.player-card::before{content:"";position:absolute;top:10px;left:10px;right:10px;bottom:10px;border:1px solid rgba(231,228,224,.06);pointer-events:none;}
.cover{position:relative;width:160px;height:160px;flex:none;border-radius:50%;overflow:hidden;border:1px solid rgba(201,182,139,.3);box-shadow:0 14px 40px rgba(0,0,0,.6),inset 0 0 30px rgba(0,0,0,.6);animation:beeiSpinDisc 16s linear infinite;animation-play-state:paused;}
.cover.spin{animation-play-state:running;}
.cover img{width:100%;height:100%;object-fit:cover;display:block;}
.cover::after{content:"";position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;background:#060507;border:1px solid rgba(201,182,139,.5);transform:translate(-50%,-50%);}
.pl-meta{flex:1;min-width:240px;}
.pl-artist{font-family:'Cinzel',serif;font-size:11px;letter-spacing:3px;color:var(--gold);text-transform:uppercase;}
.pl-title{margin:6px 0 0;font-family:'Cinzel',serif;font-weight:600;font-size:26px;letter-spacing:1px;color:var(--cream);}
.pl-bar{position:relative;height:5px;margin:22px 0 8px;background:rgba(231,228,224,.10);cursor:pointer;border-radius:3px;}
.pl-fill{position:absolute;left:0;top:0;bottom:0;width:0%;background:linear-gradient(90deg,var(--red-d),var(--red-b));border-radius:3px;}
.pl-knob{position:absolute;top:50%;left:0%;transform:translate(-50%,-50%);width:12px;height:12px;border-radius:50%;background:#F6EFE6;box-shadow:0 0 10px rgba(216,30,60,.8);}
.pl-time{display:flex;justify-content:space-between;font-family:'Poiret One',sans-serif;font-size:12px;letter-spacing:1px;color:var(--muted2);}
.pl-controls{display:flex;align-items:center;gap:24px;margin-top:18px;}
.pl-play{cursor:pointer;width:60px;height:60px;border-radius:50%;border:1px solid rgba(231,228,224,.18);background:linear-gradient(180deg,#D11430,var(--red-d));color:#F6EFE6;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 30px rgba(180,18,44,.4);}
.pl-heart{font-size:18px;color:var(--red);}
.home-btn{margin-top:34px;width:54px;height:54px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#120F15,#0A080C);border:1px solid rgba(201,182,139,.35);color:var(--gold-bright);box-shadow:0 10px 28px rgba(0,0,0,.5);transition:transform .2s,border-color .2s;}
